services:

  # =========================================================
  # A. INFRAESTRUCTURA (Services que corren en contenedores)
  # =========================================================
  zookeeper:
    image: 'zookeeper:3.8'
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - anomaly-net

  kafka:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Definimos dos puertos: 9092 para comunicación interna y 29092 para externa
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # AQUÍ ESTÁ EL TRUCO: Los microservicios usarán 'broker:9092'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
    - "29092:29092"  # ← ESTO debe estar presente
    networks:
      - anomaly-net  # IMPORTANTE: Kafka DEBE estar en la misma red que los servicios
    
  database:
    image: 'postgres:14-alpine'
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=anomalydb
    ports:
      - '5432:5432' # Mapeo a localhost para las APPs de desarrollo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anomaly-net

  # =========================================================
  # B. MICROSERVICIOS (Services de Spring Boot para Docker)
  # Requieren que cada carpeta tenga un Dockerfile.
  # =========================================================

  entrypoint-service:
    build: ./entrypoint-service
    depends_on:
      - kafka
    environment:
      # Las apps dentro de Docker usan el nombre del servicio de Kafka para conectarse
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8080
    ports:
      - '8080:8080'
    networks:
      - anomaly-net

  anomaly-detector-service:
    build: ./anomaly-detector-service
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - SERVER_PORT=8081
    ports:
      - '8081:8081'
    networks:
      - anomaly-net

  persistance-service:
    build: ./persistance-service
    depends_on:
      - kafka
      - database
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/anomalydb
      - SERVER_PORT=8082
    ports:
      - '8082:8082'
    networks:
      - anomaly-net

  batch-processing-service:
    build: ./batch-processing-service
    depends_on:
      - kafka
      - database
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/anomalydb
      - SERVER_PORT=8083
    ports:
      - '8083:8083'
    networks:
      - anomaly-net

networks:
  anomaly-net:
    driver: bridge

volumes:
  postgres_data: